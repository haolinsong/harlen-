services:
  rabbitmq:
    # management 版本同时包含 RabbitMQ Broker 和 Web 管理界面。
    image: rabbitmq:4-management
    ports:
      # AMQP 客户端端口：Spring Boot 应用通过它连接 Broker。
      - "5672:5672"
      # Web 管理界面：http://localhost:15672
      - "15672:15672"
    environment:
      # 仅供本地学习使用。生产环境不要把账号密码直接提交到仓库。
      RABBITMQ_DEFAULT_USER: learner
      RABBITMQ_DEFAULT_PASS: learner123
    volumes:
      # 把 Broker 数据放进命名卷，容器重建后仍可保留学习数据。
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Docker 定期执行 ping；成功表示 RabbitMQ 节点已经可以响应诊断命令。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  # docker compose down 默认保留该卷；down -v 才会一并删除。
  rabbitmq-data:
