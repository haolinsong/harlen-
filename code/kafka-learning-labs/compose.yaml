services:
  kafka:
    # 固定镜像版本，保证实验不会因为 latest 漂移而突然改变行为。
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: kafka-learning
    ports:
      # Java 程序从宿主机通过 localhost:9092 访问 Kafka。
      - "9092:9092"
    environment:
      # 单节点同时承担 Broker（业务数据）和 Controller（元数据仲裁）角色，仅适合学习。
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # 三个 Listener 分别服务 Controller、宿主机客户端和容器网络内客户端。
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092

      # Kafka 返回给客户端的真实连接地址，必须从对应客户端网络可达。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 只有一个 Controller 投票节点；生产环境通常使用 3 或 5 个独立 Controller。
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # 当前只有一个 Broker，所以内部 Topic 的副本因子和最小 ISR 必须是 1。
      # 这些值没有 Broker 容灾能力，绝不能照搬到生产环境。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      # 能列出 Topic 说明 Broker 已能响应基本 Admin 请求。
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      # 命名卷让 docker compose down 后数据仍保留；down -v 才会清除。
      - kafka-data:/tmp/kraft-combined-logs

volumes:
  kafka-data:
